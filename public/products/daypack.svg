      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="#e8e4dc"/>
  <rect width="900" height="1200" fill="url(#g)"/>

  <ellipse cx="450" cy="960" rx="250" ry="46" fill="#000" opacity="0.16" filter="url(#soft)"/>

  
    <path d="M300 430 Q450 340 600 430 L620 830 Q450 860 280 830 Z" fill="#5c6b52"/>
    <path d="M300 430 Q450 340 600 430 L604 510 Q450 450 296 510 Z" fill="#48563f"/>
