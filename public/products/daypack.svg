    <path d="M340 440 Q330 620 350 780 M560 440 Q570 620 550 780" fill="none" stroke="#28321f" stroke-width="8" opacity="0.35"/>

  <rect width="900" height="1200" filter="url(#grain)" opacity="0.55"/>
