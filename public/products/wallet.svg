<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img">
  <defs>
    <radialGradient id="g" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.06"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="#f1e9de"/>
  <rect width="900" height="1200" fill="url(#g)"/>

  <ellipse cx="450" cy="960" rx="250" ry="46" fill="#000" opacity="0.16" filter="url(#soft)"/>

  
    <rect x="250" y="470" width="400" height="290" rx="22" fill="#7d4b34"/>
    <rect x="250" y="470" width="400" height="42" rx="20" fill="#653a27"/>
    <g fill="none" stroke="#3a2115" stroke-width="5" opacity="0.5">
      <rect x="300" y="560" width="300" height="46" rx="10"/>
      <rect x="300" y="630" width="300" height="46" rx="10"/>
    </g>

  <rect width="900" height="1200" filter="url(#grain)" opacity="0.55"/>
</svg>
