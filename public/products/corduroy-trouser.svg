  <rect width="900" height="1200" fill="#ebe5da"/>
  <rect width="900" height="1200" fill="url(#g)"/>

  <ellipse cx="450" cy="960" rx="250" ry="46" fill="#000" opacity="0.16" filter="url(#soft)"/>

  
    <path d="M310 330 L590 330 L610 470 L580 900 L470 900 L450 560 L430 900 L320 900 L290 470 Z" fill="#8a6f4c"/>
    <path d="M310 330 L590 330 L596 372 L304 372 Z" fill="#6f5839"/>
