name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway database and dummy secrets: nothing here talks to production, and
  # the app validates that these are present rather than that they are real.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/mykart_ci
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SESSION_SECRET: ci-session-secret-that-is-long-enough-to-pass-validation
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  SUPABASE_STORAGE_BUCKET: ecommerce
  ADMIN_EMAIL: admin@mykart.local
  ADMIN_PASSWORD: admin12345

jobs:
  # Fast feedback: no database needed, so this fails in under a minute when it fails.
  static:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: Migrations, build and end-to-end
    runs-on: ubuntu-latest
    needs: static

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mykart_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exercises the real migration path, including the backfill from the legacy
      # `product` table, on a database that starts empty.
      - name: Run migrations
        run: npm run db:migrate

      - name: Seed catalog and bootstrap admin
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
